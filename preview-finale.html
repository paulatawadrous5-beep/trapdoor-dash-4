<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Finale Preview</title>
<link rel="stylesheet" href="style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0d0a0c;gap:18px;padding:20px;box-sizing:border-box;}
.replay-btn{background:transparent;border:1px solid #555;color:#aaa;border-radius:999px;padding:10px 26px;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;}
.replay-btn:active{transform:scale(.95);}
.note{color:#5a5f6e;font-size:12px;}
</style>
</head><body>
  <div class="overlay" style="position:static">
    <div class="overlay-card devil-card">
      <div class="paul-split play" id="paulSplit">
        <div class="paul-half paul-top">Paul</div>
        <div class="paul-half paul-bottom">Paul</div>
        <div class="paul-devil">😈</div>
      </div>
      <h2 id="zoneTitle">ALL 10 LEVELS CLEARED!</h2>
      <p id="zoneSub">You survived the Devil's Gauntlet. LEGEND. 😈</p>
      <button class="primary-btn">CONTINUE</button>
    </div>
  </div>
  <button class="replay-btn" id="replayBtn">↻ REPLAY ANIMATION</button>
  <div class="note">preview only — not part of the game</div>
<script>
var ps = document.getElementById('paulSplit');
var actx = null;
function paulFinaleSound() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.8);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.9);
    var o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'sawtooth';
    o2.frequency.setValueAtTime(85, t + 0.1);
    o2.frequency.exponentialRampToValueAtTime(720, t + 1.0);
    g2.gain.setValueAtTime(0.0001, t + 0.1);
    g2.gain.exponentialRampToValueAtTime(0.20, t + 0.85);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 1.15);
    o2.connect(g2); g2.connect(actx.destination);
    o2.start(t + 0.1); o2.stop(t + 1.2);
    [0.65, 0.8, 0.95, 1.15].forEach(function (d, i) {
      var tt = actx.currentTime + d;
      var oo = actx.createOscillator(), gg = actx.createGain();
      oo.type = 'square';
      oo.frequency.setValueAtTime(i % 2 ? 140 : 100, tt);
      oo.frequency.exponentialRampToValueAtTime(60, tt + 0.14);
      gg.gain.setValueAtTime(0.14, tt);
      gg.gain.exponentialRampToValueAtTime(0.001, tt + 0.14);
      oo.connect(gg); gg.connect(actx.destination);
      oo.start(tt); oo.stop(tt + 0.16);
    });
  } catch (e) {}
}
document.getElementById('replayBtn').addEventListener('click', function () {
  ps.classList.remove('play');
  void ps.offsetWidth;
  ps.classList.add('play');
  paulFinaleSound();
});
paulFinaleSound();
</script>
</body></html>
